name: Build and integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        run: echo "value=$(python3 -c 'import json; print(json.dumps(json.load(open("compatibility/candidates.json"))))')" >> "$GITHUB_OUTPUT"
  verify:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      INTEGRATION_JAVA_VERSION: ${{ matrix.java }}
      INTEGRATION_LIQUIBASE_VERSION: ${{ matrix.liquibase }}
      INTEGRATION_STARROCKS_VERSION: ${{ matrix.starrocks }}
      STARROCKS_SQL_PORT: 19030
      STARROCKS_IMAGE: starrocks/allin1-ubuntu:${{ matrix.starrocks }}
      INTEGRATION_JAR: /workspace/integration/.cache/candidate.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Unit tests and exact integration artifact
        run: |
          ./gradlew --no-daemon -PisRelease=false -PbaseVersion=0.3.0 -PtestLiquibaseVersion=${{ matrix.liquibase }} build prepareIntegrationJar
          python3 scripts/verify-project.py --jar build/integration/liquibase-starrocks.jar
          mkdir -p integration/.cache
          cp build/integration/liquibase-starrocks.jar integration/.cache/candidate.jar
      - name: Start disposable server
        run: docker compose -p liquibase-starrocks-ci -f docker-compose.integration.yml up -d starrocks
      - name: Migration and capability contract
        run: |
          set -o pipefail
          docker compose -p liquibase-starrocks-ci -f docker-compose.integration.yml run --build --rm integration 2>&1 | tee integration/.cache/scenarios.log
      - name: Official Liquibase harness with compile API 5.0.3
        if: matrix.liquibase == '5.0.4' && matrix.starrocks == '4.1.3'
        run: |
          docker compose -p liquibase-starrocks-ci -f docker-compose.integration.yml exec -T starrocks mysql -h127.0.0.1 -P9030 -uroot -e 'CREATE DATABASE harness_test;'
          ./gradlew --no-daemon -PisRelease=false harnessTest -PharnessStarRocksVersion=${{ matrix.starrocks }} -PharnessUrl=jdbc:mysql://localhost:19030/harness_test
      - name: Record successful verification
        run: |
          python3 scripts/record-verification.py --liquibase '${{ matrix.liquibase }}' --starrocks '${{ matrix.starrocks }}' --java '${{ matrix.java }}' --architecture '${{ matrix.architecture }}' --image "$STARROCKS_IMAGE" --jar integration/.cache/candidate.jar --log integration/.cache/scenarios.log --output integration/.cache/verification.json --evidence '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Capture server logs
        if: always()
        run: |
          mkdir -p build/integration-logs
          docker compose -p liquibase-starrocks-ci -f docker-compose.integration.yml logs --no-color > build/integration-logs/compose.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ matrix.liquibase }}-${{ matrix.starrocks }}-${{ matrix.java }}-${{ matrix.architecture }}
          path: |
            build/reports/tests/
            build/test-results/
            build/integration-logs/
            integration/.cache/*.log
            integration/.cache/verification.json
            integration/.cache/candidate.jar
      - name: Remove disposable stack
        if: always()
        run: docker compose -p liquibase-starrocks-ci -f docker-compose.integration.yml down -v

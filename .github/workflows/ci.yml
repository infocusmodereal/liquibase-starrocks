name: Build and integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            liquibase: '4.23.0'
            starrocks: '3.1.7'
          - java: '21'
            liquibase: '4.29.1'
            starrocks: '4.1.1'
          - java: '21'
            liquibase: '5.0.3'
            starrocks: '4.1.1'
    env:
      INTEGRATION_JAVA_VERSION: ${{ matrix.java }}
      INTEGRATION_LIQUIBASE_VERSION: ${{ matrix.liquibase }}
      STARROCKS_IMAGE: starrocks/allin1-ubuntu:${{ matrix.starrocks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and unit tests against selected runtime
        run: ./gradlew --no-daemon -PisRelease=false -PtestLiquibaseVersion=${{ matrix.liquibase }} build shadowJar
      - name: Migration, idempotence and abandoned-lock recovery
        run: docker compose -p liquibase-starrocks-ci -f docker-compose.integration.yml up --build --abort-on-container-exit --exit-code-from integration
      - name: Capture server logs
        if: always()
        run: |
          mkdir -p build/integration-logs
          docker compose -p liquibase-starrocks-ci -f docker-compose.integration.yml logs --no-color > build/integration-logs/compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ matrix.liquibase }}
          path: |
            build/reports/tests/
            build/integration-logs/
            integration/.cache/*.log
      - name: Remove disposable stack
        if: always()
        run: docker compose -p liquibase-starrocks-ci -f docker-compose.integration.yml down -v

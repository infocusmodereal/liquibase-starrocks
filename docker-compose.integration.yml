services:
  starrocks:
    image: ${STARROCKS_IMAGE:-starrocks/allin1-ubuntu:3.1.7}
    command: ["/bin/sh", "-c", "rm -f /data/deploy/starrocks/fe/bin/fe.pid && ./entrypoint.sh"]
    ports:
      - "127.0.0.1:${STARROCKS_SQL_PORT:-9030}:9030"
      - "127.0.0.1:${STARROCKS_HTTP_PORT:-8030}:8030"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  integration:
    build:
      context: .
      dockerfile: integration/Dockerfile
      args:
        JAVA_VERSION: ${INTEGRATION_JAVA_VERSION:-17}
    depends_on:
      - starrocks
    working_dir: /workspace
    volumes:
      - ./integration/.cache:/workspace/integration/.cache
    environment:
      - STARROCKS_HOST=starrocks
      - STARROCKS_PORT=9030
      - INTEGRATION_LIQUIBASE_VERSION=${INTEGRATION_LIQUIBASE_VERSION:-4.23.0}
      - EXTENSION_VERSION=${EXTENSION_VERSION:-}
      - MYSQL_DRIVER_VERSION=8.4.0
    command: ["bash", "integration/run-integration.sh"]
